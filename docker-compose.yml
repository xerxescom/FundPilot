services:
  postgres:
    image: postgres:16
    container_name: fundpilot_postgres
    environment:
      POSTGRES_DB: fund_watcher
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port $${BACKEND_PORT:-8000}"
    depends_on:
      - postgres
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    env_file:
      - .env

  dashboard:
    build: .
    command: sh -c "streamlit run dashboard/streamlit_app.py --server.port $${STREAMLIT_PORT:-8501} --server.address 0.0.0.0"
    depends_on:
      - backend
    ports:
      - "${STREAMLIT_PORT:-8501}:${STREAMLIT_PORT:-8501}"
    env_file:
      - .env

volumes:
  postgres_data:
