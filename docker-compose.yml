# 使用方式：
#   copy .env.docker.example .env.docker   （填写密钥后）
#   docker compose --env-file .env.docker up -d --build
# 启动顺序：postgres（健康）→ migrate（一次性迁移）→ backend / worker → frontend
# 所有对外端口默认只绑定回环地址 127.0.0.1，不暴露到局域网。
# 网络受限时可在 .env.docker 设置 DOCKER_UV_INDEX_URL 使用镜像源加速依赖安装。
x-backend-build: &backend-build
  context: .
  args:
    UV_INDEX_URL: ${DOCKER_UV_INDEX_URL:-}

services:
  postgres:
    image: postgres:16
    container_name: fundpilot_postgres
    environment:
      POSTGRES_DB: ${DOCKER_POSTGRES_DB:-fund_watcher}
      POSTGRES_USER: ${DOCKER_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${DOCKER_POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${DOCKER_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 一次性迁移服务：与服务启动分离，backend/worker 等它成功后再启动
  migrate:
    build: *backend-build
    command: ["alembic", "upgrade", "head"]
    env_file:
      - path: .env.docker
        required: false
    environment:
      APP_ENV: docker
      DATABASE_URL: postgresql+psycopg2://${DOCKER_POSTGRES_USER:-postgres}:${DOCKER_POSTGRES_PASSWORD:-postgres}@postgres:5432/${DOCKER_POSTGRES_DB:-fund_watcher}
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: *backend-build
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - path: .env.docker
        required: false
    environment:
      APP_ENV: docker
      DATABASE_URL: postgresql+psycopg2://${DOCKER_POSTGRES_USER:-postgres}:${DOCKER_POSTGRES_PASSWORD:-postgres}@postgres:5432/${DOCKER_POSTGRES_DB:-fund_watcher}
      AUTO_CREATE_TABLES: "false"
      ENABLE_SCHEDULER: ${DOCKER_ENABLE_SCHEDULER:-false}
      SYNC_NAV_CRON: ${DOCKER_SYNC_NAV_CRON:-18:00}
      OLLAMA_BASE_URL: ${DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${DOCKER_BACKEND_PORT:-8000}:8000"
    healthcheck:
      # 就绪探针包含数据库连通与迁移到 head；migrate 已完成，这里不会长期未就绪
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # 独立批次 worker：消费每日更新批次，带租约与心跳
  worker:
    build: *backend-build
    command: ["python", "-m", "app.worker"]
    env_file:
      - path: .env.docker
        required: false
    environment:
      APP_ENV: docker
      DATABASE_URL: postgresql+psycopg2://${DOCKER_POSTGRES_USER:-postgres}:${DOCKER_POSTGRES_PASSWORD:-postgres}@postgres:5432/${DOCKER_POSTGRES_DB:-fund_watcher}
      AUTO_CREATE_TABLES: "false"
      OLLAMA_BASE_URL: ${DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # 指标只在 compose 内网暴露（不发布端口到宿主机）
      WORKER_METRICS_PORT: "9101"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -m app.worker --healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # 前端静态构建产物由 nginx 托管，并反代 /api 到 backend
  frontend:
    build:
      context: ./frontend
      args:
        NPM_REGISTRY: ${DOCKER_NPM_REGISTRY:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DOCKER_FRONTEND_PORT:-5173}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
