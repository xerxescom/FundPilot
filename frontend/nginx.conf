server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 静态构建产物 + SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass http://backend:8000;
    }

    location = /livez {
        proxy_pass http://backend:8000;
    }

    location = /readyz {
        proxy_pass http://backend:8000;
    }
}
